<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Your Harmonious email is verified" />
    <title>Email verified | Harmonious</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0e12;
        --surface: #1a1a24;
        --line: #2a2a36;
        --text: #f2f0fa;
        --muted: #9b97ab;
        --accent: #00f2fe;
        --accent-2: #4facfe;
        --ok: #7ed9a7;
        --err: #ff8d8d;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 18% 0%, #142841 0, transparent 36rem),
          radial-gradient(circle at 90% 10%, rgba(0, 242, 254, 0.08) 0, transparent 22rem),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }
      .card {
        width: min(100%, 440px);
        border: 1px solid var(--line);
        border-radius: 24px;
        background: rgba(26, 26, 36, 0.92);
        padding: 36px 28px 32px;
        text-align: center;
      }
      .brand {
        margin: 0 0 22px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(0, 242, 254, 0.18), rgba(79, 172, 254, 0.12));
        border: 1px solid rgba(0, 242, 254, 0.35);
        font-size: 1.8rem;
      }
      .icon.error {
        background: rgba(255, 141, 141, 0.12);
        border-color: rgba(255, 141, 141, 0.35);
      }
      .icon.pending {
        background: rgba(255, 197, 110, 0.12);
        border-color: rgba(255, 197, 110, 0.35);
      }
      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 5vw, 1.9rem);
        line-height: 1.2;
      }
      p {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 0.98rem;
        line-height: 1.6;
      }
      .steps {
        margin: 24px 0 0;
        padding: 0;
        list-style: none;
        text-align: left;
      }
      .steps li {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 0;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .steps li:last-child { border-bottom: 1px solid var(--line); }
      .n {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(0, 242, 254, 0.12);
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 700;
        margin-top: 1px;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #0a1628;
        font-weight: 700;
        font-size: 0.95rem;
        text-decoration: none;
        cursor: pointer;
        width: 100%;
      }
      .cta:disabled {
        opacity: 0.65;
        cursor: wait;
      }
      .cta.secondary {
        margin-top: 12px;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
      }
      footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <main class="card" id="panel">
      <p class="brand">Harmonious</p>
      <div class="icon pending" id="icon">…</div>
      <h1 id="title">Confirming email</h1>
      <p id="message">One moment while we prepare your verification.</p>
      <ol class="steps hidden" id="steps">
        <li><span class="n">1</span><span>Open the Harmonious app on your phone</span></li>
        <li><span class="n">2</span><span>Sign in with the email you just verified</span></li>
        <li><span class="n">3</span><span>Finish profile setup and start your Today dashboard</span></li>
      </ol>
      <button class="cta hidden" type="button" id="confirm-btn">Confirm my email</button>
      <button class="cta secondary hidden" type="button" id="open-app">Done — open the app</button>
      <a class="cta secondary" href="/privacy-policy.html">Privacy policy</a>
      <footer>Your life, understood.</footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
      (function () {
        var icon = document.getElementById("icon");
        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var steps = document.getElementById("steps");
        var confirmBtn = document.getElementById("confirm-btn");
        var openApp = document.getElementById("open-app");
        var client = null;
        var tokenHash = "";
        var otpType = "signup";

        function setState(kind, heading, body, opts) {
          opts = opts || {};
          icon.className = "icon" + (kind ? " " + kind : "");
          icon.textContent = opts.glyph || (kind === "error" ? "!" : kind === "pending" ? "…" : "✓");
          title.textContent = heading;
          message.textContent = body;
          steps.classList.toggle("hidden", !opts.showSteps);
          confirmBtn.classList.toggle("hidden", !opts.showConfirm);
          openApp.classList.toggle("hidden", !opts.showOpenApp);
        }

        function paramsFrom(locationPart) {
          return new URLSearchParams(locationPart.replace(/^[#?]/, ""));
        }

        function readAuthParams() {
          var query = paramsFrom(window.location.search);
          var hash = paramsFrom(window.location.hash);
          return {
            error: query.get("error") || query.get("error_code") || hash.get("error") || hash.get("error_code"),
            errorDesc: (query.get("error_description") || hash.get("error_description") || "").replace(/\+/g, " "),
            accessToken: hash.get("access_token") || query.get("access_token"),
            refreshToken: hash.get("refresh_token") || query.get("refresh_token"),
            tokenHash: hash.get("token_hash") || query.get("token_hash"),
            type: (hash.get("type") || query.get("type") || "signup").toLowerCase(),
            code: query.get("code") || hash.get("code"),
          };
        }

        async function loadClient() {
          var configRes = await fetch("/auth/client-config.json");
          if (!configRes.ok) throw new Error("Could not load auth config from the server.");
          var config = await configRes.json();
          if (!config.supabaseUrl || !config.supabaseAnonKey) {
            throw new Error("Auth is not configured on the server.");
          }
          return window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
        }

        async function verifyWithTokenHash() {
          var attempts = [otpType, "signup", "email"].filter(function (value, index, all) {
            return value && all.indexOf(value) === index;
          });
          var lastError = null;
          for (var i = 0; i < attempts.length; i++) {
            var result = await client.auth.verifyOtp({
              type: attempts[i],
              token_hash: tokenHash,
            });
            if (!result.error) return;
            lastError = result.error;
          }
          throw lastError || new Error("Verification failed.");
        }

        async function runVerification() {
          confirmBtn.disabled = true;
          confirmBtn.textContent = "Confirming…";
          setState("pending", "Confirming email", "Please wait a moment.", {});
          try {
            if (tokenHash) {
              await verifyWithTokenHash();
            }
            showSuccess();
          } catch (err) {
            var msg = (err && err.message) || "This confirmation link is no longer valid.";
            setState(
              "error",
              "Link expired or invalid",
              msg + " Open the Harmonious app and request a new verification email from sign-up or login.",
              { showOpenApp: true },
            );
            confirmBtn.disabled = false;
            confirmBtn.textContent = "Confirm my email";
          }
        }

        function showSuccess() {
          setState(
            "",
            "Email verified",
            "Your email is confirmed. Open the Harmonious app and sign in to continue your wellness journey.",
            { showSteps: true, showOpenApp: true, glyph: "✓" },
          );
          // Clean sensitive tokens from the address bar.
          if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        }

        openApp.addEventListener("click", function () {
          // Try the app only — do not bounce users to the API homepage.
          window.location.href = "harmonious://login";
        });

        confirmBtn.addEventListener("click", function () {
          runVerification();
        });

        async function init() {
          var auth = readAuthParams();

          if (auth.error) {
            setState(
              "error",
              "Link expired or invalid",
              (auth.errorDesc || "This confirmation link is no longer valid.") +
                " Open the Harmonious app and request a new verification email from sign-up or login.",
              { showOpenApp: true },
            );
            return;
          }

          try {
            client = await loadClient();
            tokenHash = auth.tokenHash || "";
            otpType = auth.type || "signup";

            if (auth.accessToken && auth.refreshToken) {
              var sessionResult = await client.auth.setSession({
                access_token: auth.accessToken,
                refresh_token: auth.refreshToken,
              });
              if (sessionResult.error) throw sessionResult.error;
              showSuccess();
              return;
            }

            if (auth.code) {
              var exchange = await client.auth.exchangeCodeForSession(auth.code);
              if (exchange.error) throw exchange.error;
              showSuccess();
              return;
            }

            if (tokenHash) {
              // Require a tap so email security scanners cannot burn the one-time link.
              setState(
                "pending",
                "Verify your email",
                "Tap the button below to confirm your Harmonious account. This step protects your link from being used by email scanners.",
                { showConfirm: true, glyph: "✉" },
              );
              return;
            }

            setState(
              "pending",
              "Open the link from your email",
              "This page verifies Harmonious accounts. Use the “Verify email address” button in your signup email, then return here.",
              { showOpenApp: true },
            );
          } catch (err) {
            setState(
              "error",
              "Link expired or invalid",
              ((err && err.message) || "We could not verify this link.") +
                " Open the Harmonious app and request a new verification email.",
              { showOpenApp: true },
            );
          }
        }

        init();
      })();
    </script>
  </body>
</html>
