<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm email change | Harmonious</title>
  </head>
  <body style="margin:0;padding:0;background:#0E0E12;">
    <!--
      Supabase → Authentication → Email Templates → Change Email Address
      Subject: Confirm your new Harmonious email
      Keep {{ .ConfirmationURL }} exactly as-is.
    -->
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0E0E12;background-image:radial-gradient(circle at 18% 0%,#142841 0,transparent 36rem);padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:520px;border-collapse:separate;">
            <tr>
              <td align="center" style="padding:0 0 18px 0;">
                <div style="font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:#00F2FE;font-weight:700;">Harmonious</div>
              </td>
            </tr>
            <tr>
              <td style="background:#1A1A24;border:1px solid #2A2A36;border-radius:24px;padding:36px 28px 32px 28px;">
                <table role="presentation" width="100%">
                  <tr>
                    <td align="center" style="padding:0 0 20px 0;">
                      <div style="width:72px;height:72px;border-radius:999px;background:linear-gradient(135deg,rgba(0,242,254,0.18),rgba(79,172,254,0.12));border:1px solid rgba(0,242,254,0.35);line-height:72px;font-size:28px;">✉</div>
                    </td>
                  </tr>
                  <tr>
                    <td align="center">
                      <h1 style="margin:0;font-size:26px;line-height:1.25;color:#F2F0FA;font-weight:700;">Confirm your new email</h1>
                      <p style="margin:14px 0 0;font-size:15px;line-height:1.65;color:#9B97AB;">
                        Confirm this address to finish updating the email on your Harmonious account.
                      </p>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding:28px 0 8px 0;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;border-radius:999px;background:linear-gradient(135deg,#00F2FE,#4FACFE);color:#0A1628;font-size:15px;font-weight:700;text-decoration:none;">
                        Confirm new email
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top:22px;">
                      <p style="margin:0;font-size:13px;line-height:1.6;color:#9B97AB;text-align:center;">
                        If you didn’t request an email change, ignore this message.
                      </p>
                      <p style="margin:18px 0 0;font-size:12px;line-height:1.55;color:#6E6A7C;word-break:break-all;text-align:center;">
                        Button not working?<br />
                        <a href="{{ .ConfirmationURL }}" style="color:#00F2FE;text-decoration:none;">{{ .ConfirmationURL }}</a>
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:22px 8px 0 8px;">
                <p style="margin:0;font-size:12px;color:#6E6A7C;">Your life, understood.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
